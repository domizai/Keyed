name: Release

# Push a tag like v1.0.0 to build and publish Keyed.zip, Keyed.pdex and Keyed.txt.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release artifacts
        run: ./gradlew -PgithubReleaseTag=${{ github.ref_name }} buildReleaseArtifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Keyed.zip
            release/Keyed.pdex
            release/Keyed.txt
